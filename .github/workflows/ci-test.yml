name: Verify and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: checkout branch commit
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # Showcase publication checks only. No model tests, benchmark runs, or API keys.
    - name: Verify release files (offline)
      run: python scripts/verify_release.py
